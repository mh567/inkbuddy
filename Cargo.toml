[workspace]
resolver = "2"
members = [
    "crates/inkbuddy-protocol",
    "crates/inkbuddy-host",
    "crates/inkbuddy-plugin-lyrics",
    "crates/inkbuddy-plugin-clock",
    "crates/inkbuddy-plugin-ai-quota",
    "crates/inkbuddy-plugin-command-code",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
authors = ["harris"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
