<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>__TITLE__</title>
<style>
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #ffffff; color: #000000;
    font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #wrap {
    box-sizing: border-box; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 6vw 5vw; text-align: center;
  }
  .plugin-section { width: 100%; }
  .plugin-section + .plugin-section {
    margin-top: 4vh;
    border-top: 1px solid #d0d0d0;
    padding-top: 4vh;
  }
  .block { width: 100%; }
  .block + .block { margin-top: 2vh; }

  /* Line roles shared by every plugin */
  .line { width: 100%; word-break: break-word; display: flex;
          align-items: center; justify-content: center; }
  .line-primary { font-size: 6.2vw; font-weight: 700; color: #000000;
                  line-height: 1.4; margin: 2.5vh 0; }
  .line-normal  { font-size: 5vw; font-weight: 400; color: #000000; line-height: 1.4; }
  .line-muted   { font-size: 5vw; font-weight: 400; color: #8a8a8a;
                  line-height: 1.4; min-height: 7vw; }

  /* Reading line (e.g. Jyutping) sits on its own centred row, close to the
     Chinese line above it so the two read as one unit. */
  .line-reading { font-size: 4.6vw; font-weight: 400; color: #505050;
                  line-height: 1.25; margin: -2.4vh 0 1.8vh; }

  .kv { display: flex; justify-content: center; gap: 2vw; font-size: 4vw;
        line-height: 1.8; }
  .kv-k { color: #8a8a8a; }
  .kv-v { color: #000000; font-weight: 700; }
  /* Track title and artist: a serif/handwriting face for a quieter, more
     literary look than the sans-serif used for lyrics. */
  .block-text p { font-size: 3.8vw; line-height: 1.6; margin: 0;
                  letter-spacing: 0.1em;
                  font-family: "Kaiti SC", "STKaiti", "KaiTi", "Noto Serif CJK SC", "Songti SC", serif; }

  #status { position: fixed; right: 8px; bottom: 6px; font-size: 10px;
            color: #c8c8c8; }

  /* 黑白：把所有灰阶推到纯黑，去掉拼音行的浅色 */
  body.mode-bw .line-muted, body.mode-bw .line-reading,
  body.mode-bw .kv-k, body.mode-bw #status { color: #000000; }
  body.mode-bw .plugin-section + .plugin-section { border-top-color: #000000; }

  /* 纯文本：隐藏注音行和装饰性的衬线标题，正文放大 */
  body.mode-text .line-reading { display: none; }
  body.mode-text .block-text p {
    font-family: inherit; letter-spacing: 0; font-size: 5vw; font-weight: 700;
  }
  body.mode-text .line-muted { color: #000000; }

  /* 反色：黑底白字 */
  body.invert { background: #000000; color: #ffffff; }
  body.invert .line-primary, body.invert .line-normal,
  body.invert .kv-v { color: #ffffff; }
  body.invert .line-muted, body.invert .kv-k { color: #b0b0b0; }
  body.invert .line-reading { color: #d0d0d0; }
  body.invert .plugin-section + .plugin-section { border-top-color: #555555; }
  body.invert #status { color: #555555; }
  body.invert.mode-bw .line-muted, body.invert.mode-bw .line-reading,
  body.invert.mode-bw .kv-k, body.invert.mode-bw #status { color: #ffffff; }
  body.invert.mode-bw .plugin-section + .plugin-section { border-top-color: #ffffff; }
</style>
</head>
<body>
<div id="wrap"><div id="frame">载入中…</div></div>
<div id="status"></div>
<script>
(function () {
  var frameEl = document.getElementById('frame');
  var statusEl = document.getElementById('status');
  var lastSig = null;
  var timer = null;

  // Selection lives in the URL so the same host can serve different E-Ink
  // devices with different plugin combinations. No storage, no cookies.
  var qs = new URLSearchParams(location.search);
  var selected = qs.get('plugins') || '';

  var body = document.body;

  // 按服务端下发的设置切换样式；参数缺省时退回灰度、不反色。
  function applyDisplay(mode, invert) {
    var m = (mode === 'bw' || mode === 'text') ? mode : 'gray';
    body.classList.remove('mode-gray', 'mode-bw', 'mode-text', 'invert');
    body.classList.add('mode-' + m);
    if (invert) body.classList.add('invert');
  }
  // 首帧前先用地址里的值兜底，避免等待期间闪一下默认样式
  applyDisplay(qs.get('mode'), qs.get('invert') === '1');

  var REQUEST_TIMEOUT_MS = 8000;

  function setStatus(text) {
    // Writing the same text every 500ms is a pointless DOM write on E-Ink.
    if (statusEl.textContent !== text) statusEl.textContent = text;
  }

  function schedule(ms) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, ms);
  }

  function poll() {
    var url = '/api/frame' + (selected ? '?plugins=' + encodeURIComponent(selected) : '');
    // A half-open connection can leave fetch pending forever. AbortSignal is
    // not available on every embedded browser, so use AbortController.
    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timedOut = false;
    var watchdog = setTimeout(function () {
      timedOut = true;
      if (controller) controller.abort();
      setStatus('连接超时');
      schedule(2000);
    }, REQUEST_TIMEOUT_MS);
    var options = { cache: 'no-store' };
    if (controller) options.signal = controller.signal;

    fetch(url, options)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) {
        if (timedOut) return;
        clearTimeout(watchdog);
        // 显示设置由服务端下发，控制端改设置后下一次取帧即生效，无需改地址。
        applyDisplay(d.mode, d.invert);
        // E-Ink: only touch the DOM when the content actually changed.
        if (d.signature && d.signature !== lastSig) {
          frameEl.innerHTML = d.html;
          lastSig = d.signature;
        } else if (!d.signature || !d.active || !d.active.length) {
          // Never clear to a blank white page; keep a visible placeholder
          // and stay on the retry loop so a recovering plugin is picked up.
          var placeholder = '<div class="block block-text"><p>无可用插件</p></div>';
          if (frameEl.innerHTML !== placeholder) frameEl.innerHTML = placeholder;
          lastSig = null;
        }
        setStatus(d.active && d.active.length ? d.active.join(' + ') : '无插件');
        // 轮询间隔与墨水屏重绘解耦：refresh_ms 是插件内容的变化节奏（时钟 15 秒），
        // 但控制端改插件开关后设备要尽快感知，所以轮询固定走短间隔。
        // 内容没变时签名相同，不会碰 DOM，因此不会增加墨水屏刷新次数。
        schedule(300);
      })
      .catch(function () {
        if (timedOut) return;
        clearTimeout(watchdog);
        setStatus('连接失败');
        schedule(2000);
      });
  }

  poll();
})();
</script>
</body>
</html>
