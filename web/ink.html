  /* 内容坐标系单位：默认与视口单位一致（1vw/1vh）。手动旋转（仅全屏）
     时两个变量对调成 1vh/1vw，页面里随内容宽高变化的尺寸都写成
     calc(N * var(--uw)) / calc(N * var(--uh))，旋转后字号与留白仍按
     内容自身的宽高计算，而不是物理视口的宽高。 */
  :root { --bar-h: 56px; --canvas-h: calc(100vh - var(--bar-h)); --uw: 1vw; --uh: 1vh; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #ffffff; color: #000000;
    font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  body { display: flex; flex-direction: column; }
  body.reader-full { --canvas-h: 100vh; }
  #wrap {
    box-sizing: border-box; flex: 1 0 auto; min-height: var(--canvas-h);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: calc(6 * var(--uw)) calc(5 * var(--uw)); text-align: center;
  }
  #frame { width: 100%; }
  .plugin-section { width: 100%; }
  .plugin-section + .plugin-section {
    margin-top: calc(4 * var(--uh));
    border-top: 1px solid #d0d0d0;
    padding-top: calc(4 * var(--uh));
  }
  /* 区域布局模式（当前视图生效时）：frame-canvas 铺满屏幕，
     每个扩展按视图里保存的百分比区域绝对定位。body.layout-region 由
     页面脚本根据 frame 响应的 layout 字段切换，容器去掉留白。 */
  body.layout-region #wrap { padding: 0; }
  .frame-canvas { position: relative; width: 100%; height: var(--canvas-h); }
  /* 区域四周留白：内容不贴墨水屏边缘。竖排/流式布局由 #wrap 的
     padding 负责，区域布局没有这层留白，所以加在区块自己身上。
     上下对应 host 的 REGION_PAD_Y、左右对应 REGION_PAD_X，两个方向都
     参与字号缩放（按留白后的可用宽高算），不要单独改其中一个。 */
  .frame-canvas .plugin-section {
    position: absolute; overflow: hidden;
    box-sizing: border-box;
    padding: calc(3 * var(--uh)) calc(4 * var(--uw));
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  /* 相邻区块只清掉竖排布局的间距与分隔线。留白再写一遍：这条选择器
     比上面那条更具体，不写 padding 会让基础排版里的 padding-top（4 个
     --uh 单位）有机会顶回来
     有机会顶回来（取决于两条规则的先后），第二个以后的区块就没上留白。 */
  .frame-canvas .plugin-section + .plugin-section {
    margin: 0; border-top: 0;
    padding: calc(3 * var(--uh)) calc(4 * var(--uw));
  }
  .block { width: 100%; }
  .block + .block { margin-top: calc(2 * var(--uh)); }

  /* Line roles shared by every plugin */
  .line { width: 100%; word-break: break-word; display: flex;
          align-items: center; justify-content: center; }
  .line-primary { font-size: calc(6.2 * var(--uw)); font-weight: 700; color: #000000;
                  line-height: 1.4; margin: calc(2.5 * var(--uh)) 0; }
  .line-normal  { font-size: calc(5 * var(--uw)); font-weight: 400; color: #000000; line-height: 1.4; }
  .line-muted   { font-size: calc(5 * var(--uw)); font-weight: 400; color: #8a8a8a;
                  line-height: 1.4; min-height: calc(7 * var(--uw)); }

  /* Reading line (e.g. Jyutping) sits on its own centred row, close to the
     Chinese line above it so the two read as one unit. */
  .line-reading { font-size: calc(4.6 * var(--uw)); font-weight: 400; color: #505050;
                  line-height: 1.25; margin: calc(-2.4 * var(--uh)) 0 calc(1.8 * var(--uh)); }

  .kv { display: flex; justify-content: center; gap: calc(2 * var(--uw));
        font-size: calc(4 * var(--uw)); line-height: 1.8; }
  .kv-k { color: #8a8a8a; }
  .kv-v { color: #000000; font-weight: 700; }
  /* Track title and artist: a serif/handwriting face for a quieter, more
     literary look than the sans-serif used for lyrics. */
  .block-text p { font-size: calc(3.8 * var(--uw)); line-height: 1.6; margin: 0;
                  letter-spacing: 0.1em;
                  font-family: "Kaiti SC", "STKaiti", "KaiTi", "Noto Serif CJK SC", "Songti SC", serif; }

  #status { position: fixed; right: 8px; bottom: calc(var(--bar-h) + 6px);
            font-size: 10px; color: #c8c8c8; }

  /* 底部条：56px 适合手指点按；上边一条实线勾出轮廓，
     中间的字用细线胶囊框起来，两侧各一条短横线，白底保持墨水屏观感。 */
  #reader-bar {
    box-sizing: border-box;
    flex: 0 0 var(--bar-h); height: var(--bar-h);
    display: flex; align-items: center; justify-content: center;
    background: #ffffff; color: #000000;
    border-top: 2px solid #bcbcbc;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation; cursor: pointer;
  }
  #reader-bar::before, #reader-bar::after {
    content: ''; width: 32px; height: 1px; background: #c8c8c8;
  }
  #reader-bar::before { margin-right: 14px; }
  #reader-bar::after  { margin-left: 14px; }
  #reader-bar .wordmark {
    border: 1px solid #9a9a9a; border-radius: 16px;
    padding: 7px 22px 6px; line-height: 1;
    font-size: 15px; font-weight: 600; letter-spacing: 0.16em;
  }
  /* 全屏模式：底部条与状态行退出，内容铺满整个视口。
     同时尝试浏览器原生全屏；不支持时这套 class 仍让页面占满屏幕。 */
  body.reader-full #reader-bar, body.reader-full #status { display: none; }
  /* 编辑器与菜单里的预览：画布就是整页，底部条和状态行不占位。
     预览窗口比设备小得多，56px 的条在小画布里会吃掉两三成高度，
     区域百分比跟着变形，和墨水屏对不上。 */
  body.preview { --canvas-h: 100vh; }
  body.preview #reader-bar, body.preview #status { display: none; }
  :fullscreen, :-webkit-full-screen { width: 100%; height: 100%; background: #ffffff; }

  /* 手动旋转（全屏生效）：内容坐标系转 90°，画布宽高换成对调后的视口
     尺寸；--uw/--uh 随之对调，页面里的字号与留白自动跟随内容宽高。
     顶部按钮与左右翻页触摸区留在物理方向上，操作方向不变。 */
  body.rotated.reader-full { --canvas-h: calc(100 * var(--uh)); }
  body.rotated.reader-full #wrap {
    position: fixed; top: 0; left: 0;
    width: calc(100 * var(--uw)); height: calc(100 * var(--uh));
    flex: 0 0 auto;
    transform-origin: 0 0;
    transform: translateX(calc(100 * var(--uh))) rotate(90deg);
  }

  /* 全屏下的三块触摸区：左 30% 上一视图，中间显示/隐藏顶部按钮，右 30% 下一视图。 */
  #reader-zones { display: none; position: fixed;
                  top: 0; right: 0; bottom: 0; left: 0; z-index: 5;
                  touch-action: manipulation; }
  body.reader-full #reader-zones { display: flex; }
  .reader-zone { height: 100%; user-select: none; -webkit-user-select: none; }
  .reader-zone-left  { width: 30%; }
  .reader-zone-center { flex: 1 1 auto; }
  .reader-zone-right { width: 30%; }

  #reader-top { display: none; position: fixed; top: 0; left: 0; right: 0;
                z-index: 10; justify-content: center; align-items: flex-start;
                pointer-events: none; }
  body.reader-full.reader-controls #reader-top { display: flex; }
  /* 退出按钮像吊牌一样从屏幕顶边挂下来：顶端一个小圆环，细绳连到按钮。 */
  .hanger { display: flex; flex-direction: column; align-items: center; }
  .rope { position: relative; width: 2px; height: 64px; background: #9a9a9a; }
  .rope::before {
    content: ''; position: absolute; top: -4px; left: -3px;
    width: 8px; height: 8px; box-sizing: border-box;
    background: #ffffff; border: 1px solid #9a9a9a; border-radius: 50%;
  }
  #reader-exit, #reader-rotate {
    pointer-events: auto; touch-action: manipulation;
    background: #ffffff; color: #000000;
    border: 1px solid #868686; border-radius: 8px;
    padding: 15px 38px; font-size: 19px; font-family: inherit;
    letter-spacing: 0.06em;
  }
  /* 第二个吊牌（旋转屏幕）绳子短一截，两个吊牌之间留出间距。 */
  .hanger + .hanger { margin-left: 32px; }
  .hanger-side .rope { height: 40px; }

  /* 黑白：把所有灰阶推到纯黑，去掉拼音行的浅色 */
  body.mode-bw .line-muted, body.mode-bw .line-reading,
  body.mode-bw .kv-k, body.mode-bw #status { color: #000000; }
  body.mode-bw .plugin-section + .plugin-section { border-top-color: #000000; }

  /* 纯文本：隐藏注音行和装饰性的衬线标题，正文放大 */
  body.mode-text .line-reading { display: none; }
  body.mode-text .block-text p {
    font-family: inherit; letter-spacing: 0; font-size: calc(5 * var(--uw)); font-weight: 700;
  }
  body.mode-text .line-muted { color: #000000; }

  /* 反色：黑底白字 */
  body.invert { background: #000000; color: #ffffff; }
  body.invert .line-primary, body.invert .line-normal,
  body.invert .kv-v { color: #ffffff; }
  body.invert .line-muted, body.invert .kv-k { color: #b0b0b0; }
  body.invert .line-reading { color: #d0d0d0; }
  body.invert .plugin-section + .plugin-section { border-top-color: #555555; }
  body.invert #status { color: #555555; }
  body.invert.mode-bw .line-muted, body.invert.mode-bw .line-reading,
  body.invert.mode-bw .kv-k, body.invert.mode-bw #status { color: #ffffff; }
  body.invert.mode-bw .plugin-section + .plugin-section { border-top-color: #ffffff; }

  /* 时钟插件的点阵与台历样式。
     两条约束，兼顾墨水屏和任意大小的视图区域：
       1. 所有元素都在正常文档流里，靠 flex 排布，不用相对视口的绝对定位。
          绝对位置的 right/bottom 按整块屏幕算，区域一缩小就会被裁掉。
       2. 所有尺寸乘 --ink-scale，宿主按区域大小算好下发。 */
  .clock-dot {
    box-sizing: border-box; width: 100%;
    display: flex; flex-direction: column; align-items: center;
    gap: calc(3 * var(--uw) * var(--ink-scale, 1));
    padding: calc(4 * var(--uw) * var(--ink-scale, 1)) calc(3 * var(--uw) * var(--ink-scale, 1));
  }
  .clock-dot-time {
    font-family: "Silkscreen", "Courier New", monospace;
    font-weight: 700;
    font-size: calc(16 * var(--uw) * var(--ink-scale, 1));
    line-height: 1.05; letter-spacing: .02em;
    text-align: center; font-variant-numeric: tabular-nums;
  }
  .clock-dot-foot {
    display: flex; justify-content: center; gap: calc(2 * var(--uw) * var(--ink-scale, 1));
    font-size: calc(3.4 * var(--uw) * var(--ink-scale, 1)); color: #5e5b54;
  }
  .clock-dot-sep { color: #8a8a8a; }

  .clock-cal {
    box-sizing: border-box; width: 100%;
    display: flex; flex-direction: column; align-items: center;
    gap: calc(3.5 * var(--uw) * var(--ink-scale, 1));
    padding: calc(3 * var(--uw) * var(--ink-scale, 1)) calc(5 * var(--uw) * var(--ink-scale, 1));
  }
  .clock-cal-head, .clock-cal-foot {
    box-sizing: border-box; width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    gap: calc(2 * var(--uw) * var(--ink-scale, 1));
  }
  .clock-cal-head { align-items: flex-start; }
  .clock-cal-ym {
    font-family: "Songti SC", "STSong", "SimSun", serif;
    font-size: calc(4 * var(--uw) * var(--ink-scale, 1)); font-weight: 700; letter-spacing: .12em;
    line-height: 1.2;
  }
  .clock-cal-seal {
    flex: 0 0 auto;
    box-sizing: border-box;
    width: calc(8 * var(--uw) * var(--ink-scale, 1)); height: calc(8 * var(--uw) * var(--ink-scale, 1));
    border: 2px solid #000000; border-radius: 50%;

<body>
<div id="wrap"><div id="frame">载入中…</div></div>
<div id="status"></div>
<div id="reader-bar" role="button" aria-label="进入全屏"><span class="wordmark">inkbuddy</span></div>
<div id="reader-zones">
  <div class="reader-zone reader-zone-left" data-nav="-1"></div>
  <div class="reader-zone reader-zone-center" id="reader-center"></div>
  <div class="reader-zone reader-zone-right" data-nav="1"></div>
</div>
<div id="reader-top">
  <div class="hanger"><span class="rope"></span><button id="reader-exit" type="button">退出全屏</button></div>
  <div class="hanger hanger-side"><span class="rope"></span><button id="reader-rotate" type="button">横屏显示</button></div>
</div>
<script>
(function () {
  var frameEl = document.getElementById('frame');
  var statusEl = document.getElementById('status');
  var lastSig = null;
  var timer = null;

  // 页面版本号由服务端注入（页面内容哈希）。frame 响应里的版本与本地
  // 不一致说明 host 升级换了页面，自动刷新一次拿新页面，无需人工干预。
  var PAGE_VERSION = '__PAGE_VERSION__';

  // Selection lives in the URL so the same host can serve different E-Ink
  // devices with different plugin combinations. No storage, no cookies.
  var qs = new URLSearchParams(location.search);
  var selected = qs.get('plugins') || '';

  // 设备标识：首次打开生成一次存 localStorage，之后每次轮询带上。
  // host 按它维护设备表，多台设备并存时各自的比例互不覆盖，
  // 控制端可以明确选择跟随哪一台。localStorage 不可用时退化为
  // 不带 id：帧照常渲染，只是控制端看不到这台设备。
  var deviceId = (function () {
    try {
      var key = 'inkbuddy-device-id';
      var v = window.localStorage.getItem(key);
      if (!v) {
        v = Math.random().toString(36).slice(2, 10) + '-' + Date.now().toString(36);
        window.localStorage.setItem(key, v);
      }
      return v;
    } catch (e) {
      return '';
    }
  })();

  var body = document.body;

  // 手动旋转：全屏下把内容坐标系转 90°，在横竖屏之间切换。选择存
  // localStorage，重新进入全屏仍然保持。旋转只影响内容；顶部按钮与
  // 翻页触摸区留在物理方向上，操作方向不变。设备物理旋转带来的视口
  // 变化由下一次轮询上报，服务端按新比例重排，页面不需要额外处理。
  var ROTATE_KEY = 'inkbuddy-rotated';
  var rotated = false;
  try { rotated = window.localStorage.getItem(ROTATE_KEY) === '1'; } catch (e) {}
  var rotateBtn = document.getElementById('reader-rotate');
  function applyRotation() {
    body.classList.toggle('rotated', rotated);
    if (rotateBtn) rotateBtn.textContent = rotated ? '竖屏显示' : '横屏显示';
  }
  applyRotation();

  // 按服务端下发的设置切换样式；参数缺省时退回灰度、不反色。
  function applyDisplay(mode, invert) {
    var m = (mode === 'bw' || mode === 'text') ? mode : 'gray';
    body.classList.remove('mode-gray', 'mode-bw', 'mode-text', 'invert');
    body.classList.add('mode-' + m);
    if (invert) body.classList.add('invert');
  }
  // 首帧前先用地址里的值兜底，避免等待期间闪一下默认样式
  applyDisplay(qs.get('mode'), qs.get('invert') === '1');

  var REQUEST_TIMEOUT_MS = 8000;

  function setStatus(text) {
    // Writing the same text every 500ms is a pointless DOM write on E-Ink.
    if (statusEl.textContent !== text) statusEl.textContent = text;
  }

  function schedule(ms) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, ms);
  }

  function poll() {
    var url = '/api/frame' + (selected ? '?plugins=' + encodeURIComponent(selected) : '');
    // 上报画布（#wrap）的实际宽高：服务端把字号(vw)换算到区域高度(vh)
    // 时需要宽高比，拿不到就按正方形屏幕估算。量画布元素而不是 window，
    // 读到的就是内容真正铺排的那块区域（含全屏切换后的变化）。
    var canvasEl = document.getElementById('wrap');
    var vw = canvasEl ? canvasEl.offsetWidth : 0;
    var vh = canvasEl ? canvasEl.offsetHeight : 0;
    if ((!vw || !vh) && canvasEl) {
      vw = window.innerWidth;
      vh = window.innerHeight;
    }
    if (vw && vh) {
      url += (url.indexOf('?') >= 0 ? '&' : '?') + 'vw=' + vw + '&vh=' + vh;
    }
    if (deviceId) {
      url += (url.indexOf('?') >= 0 ? '&' : '?') + 'id=' + encodeURIComponent(deviceId);
    }
    // A half-open connection can leave fetch pending forever. AbortSignal is
    // not available on every embedded browser, so use AbortController.
    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timedOut = false;
    var watchdog = setTimeout(function () {
      timedOut = true;
      if (controller) controller.abort();
      setStatus('连接超时');
      schedule(2000);
    }, REQUEST_TIMEOUT_MS);
    var options = { cache: 'no-store' };
    if (controller) options.signal = controller.signal;

    fetch(url, options)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) {
        if (timedOut) return;
        clearTimeout(watchdog);
        // 页面版本不一致：host 已更新，重载自己拿新页面（一次性）。
        if (d.page_version && PAGE_VERSION.indexOf('__') !== 0 && d.page_version !== PAGE_VERSION) {
          location.reload();
          return;
        }
        // 显示设置由服务端下发，控制端改设置后下一次取帧即生效，无需改地址。
        applyDisplay(d.mode, d.invert);
        // 区域布局模式切换容器样式；只在变化时写 DOM，避免无谓重绘。
        if (body.classList.contains('layout-region') !== !!d.layout) {
          body.classList.toggle('layout-region', !!d.layout);
        }
        // E-Ink: only touch the DOM when the content actually changed.
        // 签名存在时以签名为准：签名相同绝不碰 DOM。这里不能因为 active
        // 为空就重写占位——空视图时服务端一直返回同一个签名，若再覆盖
        // DOM 并重置 lastSig，两个占位会每 300ms 互刷一次，墨水屏整屏闪。
        if (d.signature && d.signature !== lastSig) {
          frameEl.innerHTML = d.html;
          lastSig = d.signature;
        } else if (!d.signature) {
          // 服务端没给签名时的兜底：显示占位并留在轮询循环里，
          // 插件恢复后由签名分支接管。
          var placeholder = '<div class="block block-text"><p>无可用扩展</p></div>';
          if (frameEl.innerHTML !== placeholder) frameEl.innerHTML = placeholder;
          lastSig = null;
        }
        // 墨水屏上不显示插件名；这一行只在连接异常时留状态提示。
        setStatus('');
        // 轮询间隔与墨水屏重绘解耦：refresh_ms 是插件内容的变化节奏（时钟 15 秒），
        // 但控制端改插件开关后设备要尽快感知，所以轮询固定走短间隔。
        // 内容没变时签名相同，不会碰 DOM，因此不会增加墨水屏刷新次数。
        schedule(300);
      })
      .catch(function () {
        if (timedOut) return;
        clearTimeout(watchdog);
        setStatus('连接失败');
        schedule(2000);
      });
  }

  // 阅读式全屏：底部条进入，左/中/右三块触摸区翻视图，
  // 中间点按切换顶部退出按钮。原生全屏能用就用，不能用时靠 class 铺满视口。
  var readerFull = false;
  var switching = false;

  function nativeFullscreen(on) {
    try {
      var el = document.documentElement;
      if (on) {
        var req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req) {
          var entered = req.call(el);
          if (entered && entered.catch) entered.catch(function () {});
        }
      } else {
        var exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit && (document.fullscreenElement || document.webkitFullscreenElement)) {
          var left = exit.call(document);
          if (left && left.catch) left.catch(function () {});
        }
      }
    } catch (e) {
      // 嵌入式浏览器没有原生全屏时，CSS 模式已经让内容铺满屏幕。
    }
  }

  function enterReader() {
    if (readerFull) return;
    readerFull = true;
    body.classList.add('reader-full');
    body.classList.remove('reader-controls');
    nativeFullscreen(true);
  }

  function exitReader() {
    if (!readerFull) return;
    readerFull = false;
    body.classList.remove('reader-full', 'reader-controls');
    nativeFullscreen(false);
  }

  function syncNativeFullscreen() {
    // 原生全屏被系统手势退掉时，跟着退出阅读模式，别留下半截界面。
    if (!document.fullscreenElement && !document.webkitFullscreenElement && readerFull) {
      body.classList.remove('reader-full', 'reader-controls');
      readerFull = false;
    }
  }
  document.addEventListener('fullscreenchange', syncNativeFullscreen);
  document.addEventListener('webkitfullscreenchange', syncNativeFullscreen);

  // 视图切换和控制端走同一套接口：读视图列表与当前指针，算出相邻 id 写回。
  // 下一次取帧自然带上新布局，不需要页面自己拼区域 HTML。
  function switchView(direction) {
    if (switching) return;
    switching = true;
    body.classList.remove('reader-controls');
    fetch('/api/views', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (state) {
        var views = state.views || [];
        if (!views.length) return null;
        var index = -1;
        for (var i = 0; i < views.length; i++) {
          if (views[i].id === state.current) { index = i; break; }
        }
        var target = index < 0
          ? (direction > 0 ? 0 : views.length - 1)
          : (index + direction + views.length) % views.length;
        return views[target].id;
      })
      .then(function (id) {
        if (!id) return null;
        return fetch('/api/views/current', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: id }),
          cache: 'no-store'
        });
      })
      .then(function () {
        // 不同视图可能渲染出相同的 HTML 签名（同一个插件摆在同样的区域），
        // 清掉签名让下一帧强制重画，避免切了视图却看不到变化。
        lastSig = null;
        schedule(0);
      })
      .catch(function () { setStatus('切换视图失败'); })
      .then(function () { switching = false; });
  }

  document.getElementById('reader-exit').addEventListener('click', function (e) {
    e.stopPropagation();
    exitReader();
  });

    rotateBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      rotated = !rotated;
      try { window.localStorage.setItem(ROTATE_KEY, rotated ? '1' : '0'); } catch (e2) {}

      schedule(0);
    });

    body.classList.toggle('reader-controls');
  });
  var navZones = document.querySelectorAll('.reader-zone[data-nav]');
  for (var zi = 0; zi < navZones.length; zi++) {
    navZones[zi].addEventListener('click', function () {
      switchView(parseInt(this.getAttribute('data-nav'), 10));
    });
  }

  poll();
})();
</script>
</body>
</html>
