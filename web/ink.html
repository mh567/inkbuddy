<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>__TITLE__</title>
<style>
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #ffffff; color: #000000;
    font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #wrap {
    box-sizing: border-box; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 6vw 5vw; text-align: center;
  }
  #frame { width: 100%; }
  .plugin-section { width: 100%; }
  .plugin-section + .plugin-section {
    margin-top: 4vh;
    border-top: 1px solid #d0d0d0;
    padding-top: 4vh;
  }
  /* 区域布局模式（当前视图生效时）：frame-canvas 铺满屏幕，
     每个扩展按视图里保存的百分比区域绝对定位。body.layout-region 由
     页面脚本根据 frame 响应的 layout 字段切换，容器去掉留白。 */
  body.layout-region #wrap { padding: 0; }
  .frame-canvas { position: relative; width: 100vw; height: 100vh; }
  .frame-canvas .plugin-section {
    position: absolute; overflow: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  .frame-canvas .plugin-section + .plugin-section {
    margin: 0; border-top: 0; padding-top: 0;
  }
  .block { width: 100%; }
  .block + .block { margin-top: 2vh; }

  /* Line roles shared by every plugin */
  .line { width: 100%; word-break: break-word; display: flex;
          align-items: center; justify-content: center; }
  .line-primary { font-size: 6.2vw; font-weight: 700; color: #000000;
                  line-height: 1.4; margin: 2.5vh 0; }
  .line-normal  { font-size: 5vw; font-weight: 400; color: #000000; line-height: 1.4; }
  .line-muted   { font-size: 5vw; font-weight: 400; color: #8a8a8a;
                  line-height: 1.4; min-height: 7vw; }

  /* Reading line (e.g. Jyutping) sits on its own centred row, close to the
     Chinese line above it so the two read as one unit. */
  .line-reading { font-size: 4.6vw; font-weight: 400; color: #505050;
                  line-height: 1.25; margin: -2.4vh 0 1.8vh; }

  .kv { display: flex; justify-content: center; gap: 2vw; font-size: 4vw;
        line-height: 1.8; }
  .kv-k { color: #8a8a8a; }
  .kv-v { color: #000000; font-weight: 700; }
  /* Track title and artist: a serif/handwriting face for a quieter, more
     literary look than the sans-serif used for lyrics. */
  .block-text p { font-size: 3.8vw; line-height: 1.6; margin: 0;
                  letter-spacing: 0.1em;
                  font-family: "Kaiti SC", "STKaiti", "KaiTi", "Noto Serif CJK SC", "Songti SC", serif; }

  #status { position: fixed; right: 8px; bottom: 6px; font-size: 10px;
            color: #c8c8c8; }

  /* 黑白：把所有灰阶推到纯黑，去掉拼音行的浅色 */
  body.mode-bw .line-muted, body.mode-bw .line-reading,
  body.mode-bw .kv-k, body.mode-bw #status { color: #000000; }
  body.mode-bw .plugin-section + .plugin-section { border-top-color: #000000; }

  /* 纯文本：隐藏注音行和装饰性的衬线标题，正文放大 */
  body.mode-text .line-reading { display: none; }
  body.mode-text .block-text p {
    font-family: inherit; letter-spacing: 0; font-size: 5vw; font-weight: 700;
  }
  body.mode-text .line-muted { color: #000000; }

  /* 反色：黑底白字 */
  body.invert { background: #000000; color: #ffffff; }
  body.invert .line-primary, body.invert .line-normal,
  body.invert .kv-v { color: #ffffff; }
  body.invert .line-muted, body.invert .kv-k { color: #b0b0b0; }
  body.invert .line-reading { color: #d0d0d0; }
  body.invert .plugin-section + .plugin-section { border-top-color: #555555; }
  body.invert #status { color: #555555; }
  body.invert.mode-bw .line-muted, body.invert.mode-bw .line-reading,
  body.invert.mode-bw .kv-k, body.invert.mode-bw #status { color: #ffffff; }
  body.invert.mode-bw .plugin-section + .plugin-section { border-top-color: #ffffff; }
  /* AI 额度看板：三行结构，尺寸跟随 --ink-scale。 */
  .quota {
    box-sizing: border-box; width: 100%;
    display: flex; flex-direction: column;
    gap: calc(1.8vw * var(--ink-scale, 1));
    text-align: left;
  }
  .quota-head {
    display: flex; align-items: center;
    gap: calc(1.4vw * var(--ink-scale, 1));
  }
  .quota-mark {
    flex: 0 0 auto;
    width: calc(4.2vw * var(--ink-scale, 1));
    height: calc(4.2vw * var(--ink-scale, 1));
    background-image: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath fill=%27%23000%27 d=%27M22.2819%209.8211a5.9847%205.9847%200%200%200-.5157-4.9108%206.0462%206.0462%200%200%200-6.5098-2.9A6.0651%206.0651%200%200%200%204.9807%204.1818a5.9847%205.9847%200%200%200-3.9977%202.9%206.0462%206.0462%200%200%200%20.7427%207.0966%205.98%205.98%200%200%200%20.511%204.9107%206.051%206.051%200%200%200%206.5146%202.9001A5.9847%205.9847%200%200%200%2013.2599%2024a6.0557%206.0557%200%200%200%205.7718-4.2058%205.9894%205.9894%200%200%200%203.9977-2.9001%206.0557%206.0557%200%200%200-.7475-7.0729zm-9.022%2012.6081a4.4755%204.4755%200%200%201-2.8764-1.0408l.1419-.0804%204.7783-2.7582a.7948.7948%200%200%200%20.3927-.6813v-6.7369l2.02%201.1686a.071.071%200%200%201%20.038.052v5.5826a4.504%204.504%200%200%201-4.4945%204.4944zm-9.6607-4.1254a4.4708%204.4708%200%200%201-.5346-3.0137l.142.0852%204.783%202.7582a.7712.7712%200%200%200%20.7806%200l5.8428-3.3685v2.3324a.0804.0804%200%200%201-.0332.0615L9.74%2019.9502a4.4992%204.4992%200%200%201-6.1408-1.6464zM2.3408%207.8956a4.485%204.485%200%200%201%202.3655-1.9728V11.6a.7664.7664%200%200%200%20.3879.6765l5.8144%203.3543-2.0201%201.1685a.0757.0757%200%200%201-.071%200l-4.8303-2.7865A4.504%204.504%200%200%201%202.3408%207.872zm16.5963%203.8558L13.1038%208.364%2015.1192%207.2a.0757.0757%200%200%201%20.071%200l4.8303%202.7913a4.4944%204.4944%200%200%201-.6765%208.1042v-5.6772a.79.79%200%200%200-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759%200%200%200-.7854%200L9.409%209.2297V6.8974a.0662.0662%200%200%201%20.0284-.0615l4.8303-2.7866a4.4992%204.4992%200%200%201%206.6802%204.66zM8.3065%2012.863l-2.02-1.1638a.0804.0804%200%200%201-.038-.0567V6.0742a4.4992%204.4992%200%200%201%207.3757-3.4537l-.142.0805L8.704%205.459a.7948.7948%200%200%200-.3927.6813zm1.0976-2.3654l2.602-1.4998%202.6069%201.4998v2.9994l-2.5974%201.4997-2.6067-1.4997Z%27/%3E%3C/svg%3E");
    background-size: contain; background-repeat: no-repeat; background-position: center;
  }
  .quota-brand {
    font-size: calc(3.4vw * var(--ink-scale, 1));
    font-weight: 700; letter-spacing: .06em;
  }
  .quota-meta {
    margin-left: auto;
    font-size: calc(2.6vw * var(--ink-scale, 1));
    color: #5e5b54; font-variant-numeric: tabular-nums;
  }
  .quota-row {
    display: flex; align-items: center;
    gap: calc(1.5vw * var(--ink-scale, 1));
    font-size: calc(2.6vw * var(--ink-scale, 1));
  }
  .quota-label { flex: 0 0 auto; }
  .quota-bar {
    flex: 1 1 auto;
    height: calc(2.4vw * var(--ink-scale, 1));
    border: 2px solid #000000; background: #ffffff;
    overflow: hidden;
  }
  .quota-fill { display: block; height: 100%; background: #000000; }
  .q-0 { width: 0%; }
  .q-5 { width: 5%; }
  .q-10 { width: 10%; }
  .q-15 { width: 15%; }
  .q-20 { width: 20%; }
  .q-25 { width: 25%; }
  .q-30 { width: 30%; }
  .q-35 { width: 35%; }
  .q-40 { width: 40%; }
  .q-45 { width: 45%; }
  .q-50 { width: 50%; }
  .q-55 { width: 55%; }
  .q-60 { width: 60%; }
  .q-65 { width: 65%; }
  .q-70 { width: 70%; }
  .q-75 { width: 75%; }
  .q-80 { width: 80%; }
  .q-85 { width: 85%; }
  .q-90 { width: 90%; }
  .q-95 { width: 95%; }
  .q-100 { width: 100%; }
  .quota-pct {
    flex: 0 0 auto; min-width: 3.2em; text-align: right;
    font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .quota-reset {
    flex: 0 0 auto; color: #8a8a8a; white-space: nowrap;
  }
  .quota-stale {
    font-size: calc(2.2vw * var(--ink-scale, 1));
    color: #8a8a8a; text-align: right;
  }
  .quota-notice-text {
    font-size: calc(3.6vw * var(--ink-scale, 1));
    color: #000000;
  }

  /* 反色：图标翻白，进度条黑白互换，辅助文字推到白灰，提示文字翻白。 */
  body.invert .quota-mark { filter: invert(1); }
  body.invert .quota-bar { border-color: #ffffff; background: #000000; }
  body.invert .quota-fill { background: #ffffff; }
  body.invert .quota-meta, body.invert .quota-reset,
  body.invert .quota-stale { color: #b0b0b0; }
  body.invert .quota-notice-text { color: #ffffff; }
  /* 纯黑白：辅助文字推到纯黑；反色时推到纯白。 */
  body.mode-bw .quota-meta, body.mode-bw .quota-reset,
  body.mode-bw .quota-stale { color: #000000; }
  body.invert.mode-bw .quota-meta, body.invert.mode-bw .quota-reset,
  body.invert.mode-bw .quota-stale { color: #ffffff; }
</style>
</head>
<body>
<div id="wrap"><div id="frame">载入中…</div></div>
<div id="status"></div>
<script>
(function () {
  var frameEl = document.getElementById('frame');
  var statusEl = document.getElementById('status');
  var lastSig = null;
  var timer = null;

  // 页面版本号由服务端注入（页面内容哈希）。frame 响应里的版本与本地
  // 不一致说明 host 升级换了页面，自动刷新一次拿新页面，无需人工干预。
  var PAGE_VERSION = '__PAGE_VERSION__';

  // Selection lives in the URL so the same host can serve different E-Ink
  // devices with different plugin combinations. No storage, no cookies.
  var qs = new URLSearchParams(location.search);
  var selected = qs.get('plugins') || '';

  var body = document.body;

  // 按服务端下发的设置切换样式；参数缺省时退回灰度、不反色。
  function applyDisplay(mode, invert) {
    var m = (mode === 'bw' || mode === 'text') ? mode : 'gray';
    body.classList.remove('mode-gray', 'mode-bw', 'mode-text', 'invert');
    body.classList.add('mode-' + m);
    if (invert) body.classList.add('invert');
  }
  // 首帧前先用地址里的值兜底，避免等待期间闪一下默认样式
  applyDisplay(qs.get('mode'), qs.get('invert') === '1');

  var REQUEST_TIMEOUT_MS = 8000;

  function setStatus(text) {
    // Writing the same text every 500ms is a pointless DOM write on E-Ink.
    if (statusEl.textContent !== text) statusEl.textContent = text;
  }

  function schedule(ms) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(poll, ms);
  }

  function poll() {
    var url = '/api/frame' + (selected ? '?plugins=' + encodeURIComponent(selected) : '');
    // 上报视口尺寸：服务端把字号(vw)换算到区域高度(vh)时需要宽高比，
    // 拿不到就按正方形屏幕估算。
    var vw = window.innerWidth, vh = window.innerHeight;
    if (vw && vh) {
      url += (url.indexOf('?') >= 0 ? '&' : '?') + 'vw=' + vw + '&vh=' + vh;
    }
    // A half-open connection can leave fetch pending forever. AbortSignal is
    // not available on every embedded browser, so use AbortController.
    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timedOut = false;
    var watchdog = setTimeout(function () {
      timedOut = true;
      if (controller) controller.abort();
      setStatus('连接超时');
      schedule(2000);
    }, REQUEST_TIMEOUT_MS);
    var options = { cache: 'no-store' };
    if (controller) options.signal = controller.signal;

    fetch(url, options)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) {
        if (timedOut) return;
        clearTimeout(watchdog);
        // 页面版本不一致：host 已更新，重载自己拿新页面（一次性）。
        if (d.page_version && PAGE_VERSION.indexOf('__') !== 0 && d.page_version !== PAGE_VERSION) {
          location.reload();
          return;
        }
        // 显示设置由服务端下发，控制端改设置后下一次取帧即生效，无需改地址。
        applyDisplay(d.mode, d.invert);
        // 区域布局模式切换容器样式；只在变化时写 DOM，避免无谓重绘。
        if (body.classList.contains('layout-region') !== !!d.layout) {
          body.classList.toggle('layout-region', !!d.layout);
        }
        // E-Ink: only touch the DOM when the content actually changed.
        // 签名存在时以签名为准：签名相同绝不碰 DOM。这里不能因为 active
        // 为空就重写占位——空视图时服务端一直返回同一个签名，若再覆盖
        // DOM 并重置 lastSig，两个占位会每 300ms 互刷一次，墨水屏整屏闪。
        if (d.signature && d.signature !== lastSig) {
          frameEl.innerHTML = d.html;
          lastSig = d.signature;
        } else if (!d.signature) {
          // 服务端没给签名时的兜底：显示占位并留在轮询循环里，
          // 插件恢复后由签名分支接管。
          var placeholder = '<div class="block block-text"><p>无可用扩展</p></div>';
          if (frameEl.innerHTML !== placeholder) frameEl.innerHTML = placeholder;
          lastSig = null;
        }
        setStatus(d.active && d.active.length ? d.active.join(' + ') : '无插件');
        // 轮询间隔与墨水屏重绘解耦：refresh_ms 是插件内容的变化节奏（时钟 15 秒），
        // 但控制端改插件开关后设备要尽快感知，所以轮询固定走短间隔。
        // 内容没变时签名相同，不会碰 DOM，因此不会增加墨水屏刷新次数。
        schedule(300);
      })
      .catch(function () {
        if (timedOut) return;
        clearTimeout(watchdog);
        setStatus('连接失败');
        schedule(2000);
      });
  }

  poll();
})();
</script>
</body>
</html>
